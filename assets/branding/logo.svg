<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="380" height="96">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121B2B" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>
    <linearGradient id="platLightL" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="platDarkL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="cyanBeamL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35D8F2" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#35D8F2" />
      <stop offset="100%" stop-color="#7AAEFF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#DCE3EB" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Container (72x72) -->
  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#logoBgGrad)" stroke="#252D38" stroke-width="1.2" />
    <ellipse cx="36" cy="42" rx="28" ry="11" fill="none" stroke="rgba(53, 216, 242, 0.2)" stroke-width="1" stroke-dasharray="4 3" transform="rotate(-14 36 42)" />
    <!-- Infinite A -->
    <path d="M36 12 L12 60 L21 60 L29 42 L36 42 Z" fill="url(#platLightL)" />
    <path d="M36 12 L36 42 L43 42 L51 60 L60 60 Z" fill="url(#platDarkL)" />
    <polygon points="36,12 33,20 39,20" fill="#0B0F14" />
    <polygon points="36,22 31,38 41,38" fill="#0B0F14" />
    <!-- Horizon Crossbar -->
    <path d="M8 44 C20 40, 52 40, 64 44 C54 46, 22 46, 8 44 Z" fill="url(#cyanBeamL)" filter="url(#logoGlow)" />
    <circle cx="50" cy="42" r="2" fill="#FFFFFF" />
  </g>

  <!-- Typography / Brand Wordmark -->
  <g transform="translate(104, 20)">
    <!-- Primary Wordmark: AETHER -->
    <text x="0" y="38" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="5" fill="url(#textGrad)">AETHER</text>
    
    <!-- Secondary Positioning / Slogan: EXPLORE WITHOUT LIMITS -->
    <text x="2" y="58" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#35D8F2" opacity="0.95">EXPLORE WITHOUT LIMITS.</text>
  </g>
</svg>
