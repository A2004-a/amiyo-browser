name: Build Multi-Platform (Windows, Mac, Linux, Android)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            args: "--win --x64"
            artifact-name: AMYIO-Browser-Windows-x64
          - os: macos-latest
            target: mac
            args: "--mac"
            artifact-name: AMYIO-Browser-macOS
          - os: ubuntu-latest
            target: linux
            args: "--linux AppImage deb tar.gz --x64"
            artifact-name: AMYIO-Browser-Linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Desktop Package
        run: npx --yes electron-builder ${{ matrix.args }} --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: ignore

      - name: Release Desktop Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AMIYO Browser v1.0.0 (Windows, Mac, Linux, Android)"
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew || true
          gradle assembleDebug || ./gradlew assembleDebug

      - name: Prepare APK for Release
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/AMIYO-Browser-v1.0.0-Android.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMYIO-Browser-Android-APK
          path: output-apk/*.apk
          if-no-files-found: ignore

      - name: Release Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          draft: false
          prerelease: false
          files: output-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

