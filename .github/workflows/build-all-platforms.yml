name: Build Multi-Platform (Windows, Mac, Linux, Android)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            args: "--win --x64"
            artifact-name: AMYIO-Browser-Windows-x64
          - os: macos-latest
            target: mac
            args: "--mac"
            artifact-name: AMYIO-Browser-macOS
          - os: ubuntu-latest
            target: linux
            args: "--linux --x64"
            artifact-name: AMYIO-Browser-Linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libarchive-tools

      - name: Build Desktop Package
        run: npx --yes electron-builder ${{ matrix.args }} --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: ignore

      - name: Release Desktop Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "AETHER Browser v1.1.0 (Windows, Mac, Linux, Android, iOS)"
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/AETHER-Browser-v1.1.0-Android.apk \;
          ls -lh output-apk/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Browser-Android-APK
          path: output-apk/AETHER-Browser-v1.1.0-Android.apk
          if-no-files-found: error

      - name: Release Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          draft: false
          prerelease: false
          files: output-apk/AETHER-Browser-v1.1.0-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Package iOS IPA & Assets
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Package iOS IPA
        run: |
          mkdir -p output-ios/Payload
          cp -r ios/AetherBrowser output-ios/Payload/AetherBrowser.app 2>/dev/null || true
          cd output-ios
          zip -r AETHER-Browser-v1.1.0-iOS.ipa Payload
          ls -lh AETHER-Browser-v1.1.0-iOS.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Browser-iOS-IPA
          path: output-ios/AETHER-Browser-v1.1.0-iOS.ipa
          if-no-files-found: ignore

      - name: Release iOS IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          draft: false
          prerelease: false
          files: output-ios/AETHER-Browser-v1.1.0-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


