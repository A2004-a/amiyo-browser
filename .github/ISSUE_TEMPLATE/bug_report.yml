name: 🐛 Bug Report
description: File a bug report to help us improve AETHER Browser.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with AETHER Browser! Please fill out the information below to help us troubleshoot and resolve the bug quickly.

  - type: input
    id: version
    attributes:
      label: AETHER Browser Version
      description: What version of AETHER Browser are you running? (Check Settings > About)
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon - M1/M2/M3)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open AETHER Browser
        2. Go to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Logs or Error Output
      description: Please paste any console logs or terminal error messages here.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified that this issue does not already exist in open or closed issues.
          required: true
        - label: I am using the latest release or main branch of AETHER Browser.
          required: true

