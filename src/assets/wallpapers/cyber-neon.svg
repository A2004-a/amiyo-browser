<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="45%" stop-color="#120c2b" />
      <stop offset="70%" stop-color="#1a0b2e" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>
    <linearGradient id="neonSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="60%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0518" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#cyberBg)" />
  <circle cx="960" cy="540" r="600" fill="url(#cyberGlow)" />
  <!-- Horizon Sun -->
  <circle cx="960" cy="460" r="160" fill="url(#neonSun)" />
  <path d="M0,580 L1920,580" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6" />
  <!-- Perspective Grid Lines -->
  <g stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="960" y1="580" x2="0" y2="1080" />
    <line x1="960" y1="580" x2="240" y2="1080" />
    <line x1="960" y1="580" x2="480" y2="1080" />
    <line x1="960" y1="580" x2="720" y2="1080" />
    <line x1="960" y1="580" x2="960" y2="1080" />
    <line x1="960" y1="580" x2="1200" y2="1080" />
    <line x1="960" y1="580" x2="1440" y2="1080" />
    <line x1="960" y1="580" x2="1680" y2="1080" />
    <line x1="960" y1="580" x2="1920" y2="1080" />
    <line x1="0" y1="620" x2="1920" y2="620" />
    <line x1="0" y1="680" x2="1920" y2="680" />
    <line x1="0" y1="760" x2="1920" y2="760" />
    <line x1="0" y1="870" x2="1920" y2="870" />
    <line x1="0" y1="1010" x2="1920" y2="1010" />
  </g>
</svg>
