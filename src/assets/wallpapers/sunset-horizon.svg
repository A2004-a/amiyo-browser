<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#4c1d95" />
      <stop offset="80%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="82%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sunsetSky)" />
  <circle cx="960" cy="880" r="550" fill="url(#sunGlow)" />
  <!-- Mountains Layer 1 (Far) -->
  <polygon points="0,1080 0,840 260,760 520,860 820,720 1100,850 1380,740 1680,870 1920,780 1920,1080" fill="#2e1065" fill-opacity="0.85" />
  <!-- Mountains Layer 2 (Mid) -->
  <polygon points="0,1080 0,910 320,830 640,940 980,810 1320,930 1620,820 1920,900 1920,1080" fill="#1e1b4b" fill-opacity="0.92" />
  <!-- Mountains Layer 3 (Foreground) -->
  <polygon points="0,1080 0,980 400,910 780,1000 1180,890 1550,990 1920,940 1920,1080" fill="#090d16" />
</svg>
