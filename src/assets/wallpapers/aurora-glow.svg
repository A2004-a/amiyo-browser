<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02131e" />
      <stop offset="35%" stop-color="#072738" />
      <stop offset="70%" stop-color="#0a3d45" />
      <stop offset="100%" stop-color="#06222b" />
    </linearGradient>
    <linearGradient id="auroraGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#34d399" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#818cf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="auroraPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <filter id="auroraGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#auroraSky)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="120" cy="80" r="1.5" /><circle cx="260" cy="180" r="2.2" /><circle cx="430" cy="95" r="1.2" />
    <circle cx="610" cy="220" r="2" /><circle cx="840" cy="140" r="1.8" /><circle cx="1040" cy="70" r="2.5" />
    <circle cx="1250" cy="190" r="1.5" /><circle cx="1470" cy="110" r="2.2" /><circle cx="1690" cy="160" r="1.5" />
    <circle cx="1840" cy="85" r="2" /><circle cx="510" cy="40" r="1.5" /><circle cx="1380" cy="50" r="1.8" />
  </g>

  <!-- Glowing Aurora Curtains -->
  <path d="M-100,280 Q300,120 700,340 T1500,220 T2100,380 L2100,650 L-100,650 Z" fill="url(#auroraGreen)" opacity="0.65" filter="url(#auroraGlow)" />
  <path d="M-100,220 Q400,90 900,280 T1700,180 T2100,320 L2100,580 L-100,580 Z" fill="url(#auroraPurple)" opacity="0.55" filter="url(#auroraGlow)" />
  <path d="M-50,340 C350,180 650,420 1150,260 C1550,140 1850,360 2050,280 L2050,600 L-50,600 Z" fill="url(#auroraGreen)" opacity="0.7" filter="url(#auroraGlow)" />

  <!-- Mountain Silhouettes -->
  <polygon points="-50,1080 180,680 420,860 740,620 1020,800 1340,580 1620,790 1980,630 2000,1080" fill="#04121c" opacity="0.95" />
  <polygon points="-50,1080 320,790 620,920 940,730 1260,890 1520,740 1820,880 2000,1080" fill="#02090f" />

  <!-- Mountain Peak Ice Highlights -->
  <polyline points="150,710 180,680 210,720" stroke="#a7f3d0" stroke-width="2.5" fill="none" opacity="0.8" />
  <polyline points="710,650 740,620 770,660" stroke="#a7f3d0" stroke-width="3" fill="none" opacity="0.85" />
  <polyline points="1310,610 1340,580 1370,620" stroke="#a7f3d0" stroke-width="3" fill="none" opacity="0.85" />
  <polyline points="1950,660 1980,630 2010,670" stroke="#a7f3d0" stroke-width="2.5" fill="none" opacity="0.8" />
</svg>
