<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b001a" />
      <stop offset="35%" stop-color="#1f0338" />
      <stop offset="65%" stop-color="#3b0764" />
      <stop offset="85%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <linearGradient id="cyberGridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0b001a" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="synthSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#cyberSky)" />

  <!-- Synthwave Sun with Horizontal Blinds Cutouts -->
  <g>
    <circle cx="960" cy="540" r="260" fill="url(#synthSun)" />
    <!-- Blinds cuts -->
    <rect x="680" y="520" width="560" height="8" fill="#1f0338" />
    <rect x="680" y="550" width="560" height="12" fill="#290547" />
    <rect x="680" y="585" width="560" height="18" fill="#320655" />
    <rect x="680" y="625" width="560" height="24" fill="#3b0764" />
    <rect x="680" y="670" width="560" height="32" fill="#440970" />
    <rect x="680" y="725" width="560" height="42" fill="#500b80" />
  </g>

  <!-- Distant City Skyline Silhouettes -->
  <g fill="#120224">
    <rect x="80" y="520" width="70" height="280" />
    <rect x="180" y="460" width="90" height="340" />
    <polygon points="225,400 220,460 230,460" fill="#00f0ff" />
    <rect x="300" y="540" width="80" height="260" />
    <rect x="410" y="480" width="110" height="320" />
    <rect x="550" y="430" width="85" height="370" />
    <rect x="1280" y="450" width="95" height="350" />
    <rect x="1400" y="510" width="80" height="290" />
    <rect x="1510" y="440" width="105" height="360" />
    <polygon points="1562,380 1558,440 1566,440" fill="#ff007f" />
    <rect x="1640" y="490" width="90" height="310" />
    <rect x="1760" y="530" width="80" height="270" />
  </g>

  <!-- Glowing Windows & Neon Trim -->
  <g fill="#00f0ff" opacity="0.85">
    <rect x="195" y="480" width="6" height="6" /><rect x="210" y="480" width="6" height="6" />
    <rect x="195" y="510" width="6" height="6" /><rect x="210" y="510" width="6" height="6" />
    <rect x="565" y="450" width="8" height="8" /><rect x="585" y="450" width="8" height="8" />
    <rect x="565" y="480" width="8" height="8" /><rect x="585" y="480" width="8" height="8" />
    <rect x="1525" y="460" width="8" height="8" /><rect x="1545" y="460" width="8" height="8" />
    <rect x="1525" y="490" width="8" height="8" /><rect x="1545" y="490" width="8" height="8" />
  </g>
  <g fill="#ff007f" opacity="0.85">
    <rect x="240" y="500" width="6" height="6" /><rect x="240" y="530" width="6" height="6" />
    <rect x="610" y="470" width="8" height="8" /><rect x="610" y="500" width="8" height="8" />
    <rect x="1575" y="480" width="8" height="8" /><rect x="1575" y="510" width="8" height="8" />
  </g>

  <!-- Horizon Floor / Perspective Grid Line -->
  <rect x="0" y="780" width="1920" height="300" fill="#080012" />
  <line x1="0" y1="780" x2="1920" y2="780" stroke="#00f0ff" stroke-width="4" />

  <!-- Perspective Grid Lines -->
  <g stroke="url(#cyberGridGrad)" stroke-width="2">
    <line x1="960" y1="780" x2="960" y2="1080" />
    <line x1="960" y1="780" x2="800" y2="1080" /><line x1="960" y1="780" x2="1120" y2="1080" />
    <line x1="960" y1="780" x2="620" y2="1080" /><line x1="960" y1="780" x2="1300" y2="1080" />
    <line x1="960" y1="780" x2="420" y2="1080" /><line x1="960" y1="780" x2="1500" y2="1080" />
    <line x1="960" y1="780" x2="180" y2="1080" /><line x1="960" y1="780" x2="1740" y2="1080" />
    <line x1="960" y1="780" x2="-100" y2="1080" /><line x1="960" y1="780" x2="2020" y2="1080" />

    <!-- Horizontal Floor Grid Lines (Perspective spacing) -->
    <line x1="0" y1="800" x2="1920" y2="800" stroke-width="1.5" />
    <line x1="0" y1="830" x2="1920" y2="830" stroke-width="1.8" />
    <line x1="0" y1="875" x2="1920" y2="875" stroke-width="2.2" />
    <line x1="0" y1="940" x2="1920" y2="940" stroke-width="2.6" />
    <line x1="0" y1="1025" x2="1920" y2="1025" stroke-width="3.2" />
  </g>
</svg>
