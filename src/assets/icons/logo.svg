<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Obsidian Background Rounded Squircle Gradient -->
    <linearGradient id="aetherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121B2B" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>

    <!-- Platinum Facet Gradient (Left Apex) -->
    <linearGradient id="platLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Platinum Facet Gradient (Right Apex) -->
    <linearGradient id="platDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Electric Cyan Orbital Beam -->
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35D8F2" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#35D8F2" />
      <stop offset="85%" stop-color="#7AAEFF" />
      <stop offset="100%" stop-color="#35D8F2" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Cyan Aura Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#aetherBg)" stroke="#252D38" stroke-width="1.5" />

  <!-- Outer Orbital Exploration Ring (Subtle Track) -->
  <ellipse cx="64" cy="72" rx="46" ry="18" fill="none" stroke="rgba(53, 216, 242, 0.15)" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-14 64 72)" />

  <!-- The Infinite A: Left Structural Stem (Beveled Platinum) -->
  <path d="M64 20 L24 104 L38 104 L53 72 L64 72 Z" fill="url(#platLight)" />

  <!-- The Infinite A: Right Structural Stem (Shadowed Platinum) -->
  <path d="M64 20 L64 72 L75 72 L90 104 L104 104 Z" fill="url(#platDark)" />

  <!-- The Horizon Apex Opening / Innovation Notch -->
  <polygon points="64,20 60,34 68,34" fill="#0B0F14" />

  <!-- Inner Triangular Void -->
  <polygon points="64,38 56,66 72,66" fill="#0B0F14" />

  <!-- The Horizon Crossbar / Orbital Beam (Electric Cyan) -->
  <path d="M16 75 C36 67, 88 67, 112 75 C94 79, 40 79, 16 75 Z" fill="url(#cyanBeam)" filter="url(#cyanGlow)" />

  <!-- Active Exploration Node / Focal Star -->
  <circle cx="88" cy="71" r="3.5" fill="#FFFFFF" filter="url(#cyanGlow)" />
  <circle cx="88" cy="71" r="2" fill="#35D8F2" />
</svg>
