<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' amiyo: data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: blob:; font-src 'self' data:; connect-src 'self' https:;">
  <title>AMIYO Browser</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/browser.css">
  <link rel="stylesheet" href="styles/tabs.css">
  <link rel="stylesheet" href="styles/toolbar.css">
  <link rel="stylesheet" href="styles/homepage.css">
  <link rel="stylesheet" href="styles/bookmarks.css">
  <link rel="stylesheet" href="styles/history.css">
  <link rel="stylesheet" href="styles/downloads.css">
  <link rel="stylesheet" href="styles/settings.css">
  <link rel="stylesheet" href="styles/ai-panel.css">
</head>
<body>
  <div id="app">
    <!-- Browser Header (Tabs + Navigation Toolbar + Bookmarks Bar) -->
    <header id="browser-header">
      <!-- Row 1: Window Caption & Tab Strip -->
      <div id="tab-bar-container">
        <div class="browser-brand">
          <div class="browser-brand-logo">A</div>
        </div>
        <div id="tabs-strip"></div>
        <button id="new-tab-btn" title="New Tab (Ctrl+T)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <div id="window-controls">
          <button class="window-btn" id="window-min-btn" title="Minimize">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
          </button>
          <button class="window-btn" id="window-max-btn" title="Maximize">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6z"/></svg>
          </button>
          <button class="window-btn close-btn" id="window-close-btn" title="Close">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
      </div>

      <!-- Row 2: Navigation Toolbar -->
      <nav id="toolbar">
        <button class="nav-btn" id="back-btn" title="Click to go back (Alt+Left)" disabled>
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button class="nav-btn" id="forward-btn" title="Click to go forward (Alt+Right)" disabled>
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
        <button class="nav-btn" id="reload-btn" title="Reload page (Ctrl+R)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button class="nav-btn" id="home-btn" title="Open Homepage">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>

        <!-- Omnibox / Address Bar -->
        <div id="omnibox-container">
          <button class="omnibox-action-btn internal" id="security-badge" title="View site information">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </button>
          <input type="text" id="url-input" placeholder="Search with Google or enter address" autocomplete="off" spellcheck="false" />
          <button class="omnibox-action-btn hidden" id="clear-input-btn" title="Clear address bar">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
          <div class="zoom-badge hidden" id="zoom-badge" title="Reset zoom (Ctrl+0)">100%</div>
          <button class="omnibox-action-btn" id="bookmark-tool-btn" title="Bookmark this tab (Ctrl+D)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></svg>
          </button>

          <!-- Omnibox Suggestions Dropdown -->
          <div id="omnibox-suggestions" class="hidden"></div>
        </div>

        <!-- Toolbar Right Actions -->
        <div class="toolbar-actions">
          <button class="nav-btn ai-sparkle-btn" id="ai-tool-btn" title="AMIYO AI Assistant (Ctrl+Shift+A)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
          </button>
          <button class="nav-btn" id="downloads-tool-btn" title="Downloads (Ctrl+J)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <span class="badge-counter hidden" id="dl-badge">0</span>
          </button>
          <button class="nav-btn" id="chrome-menu-btn" title="Customize and control AMIYO Browser">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </button>
        </div>

        <!-- Chrome 3-Dots Application Menu Dropdown -->
        <div id="chrome-app-menu" class="chrome-menu-dropdown hidden">
          <div class="chrome-menu-item" id="menu-ai">
            <span class="menu-label">✨ AMIYO AI Assistant</span>
            <span class="menu-shortcut">Ctrl+Shift+A</span>
          </div>
          <div class="chrome-menu-divider"></div>
          <div class="chrome-menu-item" id="menu-new-tab">
            <span class="menu-label">New tab</span>
            <span class="menu-shortcut">Ctrl+T</span>
          </div>
          <div class="chrome-menu-item" id="menu-new-window">
            <span class="menu-label">New window</span>
            <span class="menu-shortcut">Ctrl+N</span>
          </div>
          <div class="chrome-menu-item" id="menu-new-incognito">
            <span class="menu-label">New Incognito window</span>
            <span class="menu-shortcut">Ctrl+Shift+N</span>
          </div>
          <div class="chrome-menu-divider"></div>
          <div class="chrome-menu-item" id="menu-zoom-row">
            <span class="menu-label">Zoom</span>
            <div class="zoom-controls">
              <button class="zoom-btn" id="menu-zoom-out" title="Zoom out">−</button>
              <span id="menu-zoom-val">100%</span>
              <button class="zoom-btn" id="menu-zoom-in" title="Zoom in">+</button>
              <button class="zoom-btn" id="menu-zoom-full" title="Full screen">⛶</button>
            </div>
          </div>
          <div class="chrome-menu-divider"></div>
          <div class="chrome-menu-item" id="menu-bookmarks">
            <span class="menu-label">Bookmarks</span>
            <span class="menu-shortcut">Ctrl+Shift+O</span>
          </div>
          <div class="chrome-menu-item" id="menu-history">
            <span class="menu-label">History</span>
            <span class="menu-shortcut">Ctrl+H</span>
          </div>
          <div class="chrome-menu-item" id="menu-downloads">
            <span class="menu-label">Downloads</span>
            <span class="menu-shortcut">Ctrl+J</span>
          </div>
          <div class="chrome-menu-divider"></div>
          <div class="chrome-menu-item" id="menu-find">
            <span class="menu-label">Find in page...</span>
            <span class="menu-shortcut">Ctrl+F</span>
          </div>
          <div class="chrome-menu-item" id="menu-print">
            <span class="menu-label">Print...</span>
            <span class="menu-shortcut">Ctrl+P</span>
          </div>
          <div class="chrome-menu-divider"></div>
          <div class="chrome-menu-item" id="menu-settings">
            <span class="menu-label">Settings</span>
          </div>
          <div class="chrome-menu-item" id="menu-exit">
            <span class="menu-label">Exit</span>
          </div>
        </div>

        <!-- Progress Loading Indicator -->
        <div id="page-progress-bar"></div>
      </nav>

      <!-- Row 3: Bookmarks Toolbar -->
      <div id="bookmarks-bar"></div>
    </header>

    <!-- Main View Container -->
    <main id="view-container">
      <!-- Find in Page Floating Bar -->
      <div id="find-bar" class="hidden">
        <input type="text" id="find-input" placeholder="Find in page" />
        <span id="find-results-count"></span>
        <button class="find-btn" id="find-prev-btn" title="Previous match">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button class="find-btn" id="find-next-btn" title="Next match">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
        <button class="find-btn" id="find-close-btn" title="Close find bar">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <!-- Internal Pages Container (New Tab, History, Settings, etc.) -->
      <div id="internal-page-container"></div>

      <!-- AMIYO AI Assistant Side Panel -->
      <aside id="ai-side-panel" class="ai-panel hidden">
        <!-- Header -->
        <div class="ai-header">
          <div class="ai-brand">
            <div class="ai-brand-badge">
              <svg class="icon" viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
            </div>
            <div class="ai-title-wrap">
              <span class="ai-title">AMIYO AI</span>
              <span class="ai-provider-pill" id="ai-provider-pill">Built-in Assistant</span>
            </div>
          </div>
          <div class="ai-header-actions">
            <button class="ai-btn-icon" id="ai-clear-btn" title="Clear conversation">
              <svg class="icon" viewBox="0 0 24 24"><path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14V4zM6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"/></svg>
            </button>
            <button class="ai-btn-icon" id="ai-close-btn" title="Close AI panel">
              <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>

        <!-- Quick Action Chips -->
        <div class="ai-quick-actions">
          <button class="ai-chip" data-action="summarize">📄 Summarize Page</button>
          <button class="ai-chip" data-action="highlights">✨ Key Highlights</button>
          <button class="ai-chip" data-action="explain">💡 Explain Simply</button>
          <button class="ai-chip" data-action="actionable">🎯 Action Items</button>
        </div>

        <!-- Messages Area -->
        <div class="ai-messages" id="ai-messages"></div>

        <!-- Input Area -->
        <div class="ai-input-container">
          <div class="ai-context-toggle">
            <label class="ai-context-pill">
              <input type="checkbox" id="ai-context-chk" checked />
              <span>Active Page Context</span>
            </label>
            <span id="ai-context-page-title" class="ai-context-title" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--text-muted);"></span>
          </div>
          <div class="ai-input-wrap">
            <textarea id="ai-prompt-input" class="ai-textarea" rows="1" placeholder="Ask AMIYO AI anything or about this page..."></textarea>
            <button id="ai-send-btn" class="ai-send-btn" title="Send (Enter)">
              <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </aside>
    </main>

    <!-- Modal / Dialog Backdrop -->
    <div id="overlay-backdrop">
      <div class="modal-dialog" id="modal-dialog-content"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ipc-client.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/omnibox.js"></script>
  <script src="js/tab-manager.js"></script>
  <script src="js/homepage.js"></script>
  <script src="js/bookmark-manager.js"></script>
  <script src="js/history-manager.js"></script>
  <script src="js/download-manager.js"></script>
  <script src="js/settings-manager.js"></script>
  <script src="js/ai-panel.js"></script>
  <script src="js/keyboard-shortcuts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
