<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AMIYO Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #202124;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 80px;
    }
    
    /* Brand Emblem & Logo */
    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      gap: 12px;
    }

    .brand-icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #18191a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      position: relative;
    }

    .brand-icon-circle svg {
      width: 48px;
      height: 48px;
    }

    .brand-title {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 40%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: -2px;
    }

    /* Omnibox Search Box */
    .search-box {
      width: 100%;
      max-width: 480px;
      height: 48px;
      background: #303134;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 32px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: box-shadow 0.2s, background-color 0.2s;
    }

    .search-box:focus-within {
      background: #35363a;
      box-shadow: 0 3px 12px rgba(0,0,0,0.45);
      border-color: rgba(255,255,255,0.18);
    }

    .search-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
    }
    .search-input::placeholder { color: #9aa0a6; }

    .search-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9aa0a6;
      cursor: pointer;
      border-radius: 50%;
    }

    /* Shortcuts Grid */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 12px;
      width: 100%;
      max-width: 400px;
    }
    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
    }
    .circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #303134;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.15s, background-color 0.15s;
    }
    .shortcut:active .circle {
      transform: scale(0.95);
      background: #3c4043;
    }
    .label {
      font-size: 12px;
      color: #e8eaed;
      text-align: center;
      max-width: 76px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Customize Pill */
    .customize-pill {
      position: fixed;
      bottom: 18px;
      right: 18px;
      height: 36px;
      padding: 0 16px;
      background: #303134;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      color: #e8eaed;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <!-- AMIYO Browser Unique Emblem & Logo -->
  <div class="brand-container">
    <div class="brand-icon-circle">
      <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Orbital Ambient Ring -->
        <circle cx="54" cy="54" r="42" fill="#1E293B" />
        <!-- Glowing Crest Indigo/Sapphire/Cyan Segments -->
        <path d="M54 14 A40 40 0 0 1 94 54 L86 54 A32 32 0 0 0 54 22 Z" fill="#4F46E5" />
        <path d="M94 54 A40 40 0 0 1 54 94 L54 86 A32 32 0 0 0 86 54 Z" fill="#2563EB" />
        <path d="M54 94 A40 40 0 0 1 14 54 L22 54 A32 32 0 0 0 54 86 Z" fill="#0284C7" />
        <path d="M14 54 A40 40 0 0 1 54 14 L54 22 A32 32 0 0 0 22 54 Z" fill="#06B6D4" />
        <!-- Center Disc -->
        <circle cx="54" cy="54" r="28" fill="#1E1B4B" />
        <circle cx="54" cy="54" r="24" fill="#4338CA" />
        <!-- Architectural White A -->
        <path d="M54 34 L40 74 L47 74 L50.2 64 L57.8 64 L61 74 L68 74 L54 34 Z M54 44.5 L56.6 58 L51.4 58 L54 44.5 Z" fill="#FFFFFF" />
        <!-- Futuristic Cyan Delta Crossbar -->
        <path d="M48 60 L60 60 L58 63 L50 63 Z" fill="#38BDF8" />
      </svg>
    </div>
    <div class="brand-title">AMIYO</div>
    <div class="brand-subtitle">Browser</div>
  </div>

  <!-- Search Bar -->
  <form class="search-box" action="https://www.google.com/search" method="GET">
    <svg style="width:20px;height:20px;color:#9aa0a6;flex-shrink:0;" viewBox="0 0 24 24" fill="currentColor">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <input type="text" name="q" class="search-input" placeholder="Search with Google or type URL" autocomplete="off" />
    <div class="search-tools">
      <button type="button" class="icon-btn" title="Search by voice" onclick="location.href='https://www.google.com';">
        <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" title="Google Lens" onclick="location.href='https://lens.google.com';">
        <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6m0-2a5 5 0 1 1 0 10 5 5 0 0 1 0-10m-7 4a7 7 0 1 1 14 0 7 7 0 0 1-14 0"/>
        </svg>
      </button>
    </div>
  </form>

  <!-- Shortcuts Grid -->
  <div class="shortcuts-grid">
    <a href="https://www.youtube.com" class="shortcut">
      <div class="circle" style="color:#ff0000;">▶</div>
      <span class="label">YouTube</span>
    </a>
    <a href="https://mail.google.com" class="shortcut">
      <div class="circle" style="color:#ea4335;">✉</div>
      <span class="label">Gmail</span>
    </a>
    <a href="https://www.wikipedia.org" class="shortcut">
      <div class="circle" style="color:#fff;">W</div>
      <span class="label">Wikipedia</span>
    </a>
    <a href="https://github.com" class="shortcut">
      <div class="circle" style="color:#fff;">⌨</div>
      <span class="label">GitHub</span>
    </a>
    <a href="https://x.com" class="shortcut">
      <div class="circle" style="color:#1da1f2;">𝕏</div>
      <span class="label">Twitter / X</span>
    </a>
    <a href="https://www.reddit.com" class="shortcut">
      <div class="circle" style="color:#ff4500;">🤖</div>
      <span class="label">Reddit</span>
    </a>
    <a href="https://news.google.com" class="shortcut">
      <div class="circle" style="color:#4285f4;">📰</div>
      <span class="label">News</span>
    </a>
    <a href="https://maps.google.com" class="shortcut">
      <div class="circle" style="color:#34a853;">📍</div>
      <span class="label">Maps</span>
    </a>
  </div>

  <!-- Customize Button -->
  <div class="customize-pill">
    <span>✏️ Customize AMIYO Browser</span>
  </div>

</body>
</html>
